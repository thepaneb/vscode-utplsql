name: Google Index Check

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  google-index:
    name: Check Google index status
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://thepaneb.github.io/vscode-utplsql/
      HOME_URL: https://thepaneb.github.io/vscode-utplsql/
      # Data em que o site entrou no ar; base do prazo de indexação.
      SITE_LIVE_DATE: '2026-10-07'
      GRACE_DAYS: '14'
    steps:
      - name: Authenticate to Google
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          scopes: https://www.googleapis.com/auth/webmasters.readonly

      - name: Inspect the home URL
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get("ACCESS_TOKEN", "")
          site = os.environ["SITE_URL"]
          home = os.environ["HOME_URL"]
          live = datetime.date.fromisoformat(os.environ["SITE_LIVE_DATE"])
          grace = int(os.environ["GRACE_DAYS"])

          if not token:
              print("::error::falha ao autenticar no Google (secret GSC_SERVICE_ACCOUNT_JSON?).")
              sys.exit(1)

          payload = json.dumps({"inspectionUrl": home, "siteUrl": site}).encode()
          request = urllib.request.Request(
              "https://searchconsole.googleapis.com/v1/urlInspection/index:inspect",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as err:
              detail = err.read().decode("utf-8", "replace")[:300]
              print(f"::error::URL Inspection API falhou (HTTP {err.code}): {detail}")
              sys.exit(1)

          status = data.get("inspectionResult", {}).get("indexStatusResult", {})
          verdict = status.get("verdict", "")
          coverage = status.get("coverageState", "")
          last_crawl = status.get("lastCrawlTime", "")
          canonical = status.get("googleCanonical", "")
          indexed = verdict == "PASS"

          days = (datetime.datetime.now(datetime.timezone.utc).date() - live).days

          table = (
              f"## Google index — {site}\n\n"
              "| Item | Valor |\n"
              "|---|---|\n"
              f"| Indexada | {str(indexed).lower()} |\n"
              f"| verdict | {verdict or '—'} |\n"
              f"| coverageState | {coverage or '—'} |\n"
              f"| lastCrawlTime | {last_crawl or '—'} |\n"
              f"| googleCanonical | {canonical or '—'} |\n"
              f"| Dias desde o go-live | {days} (limite: {grace}) |\n"
          )
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write(table)
          print(table)

          if indexed:
              print("OK: home indexada no Google.")
              sys.exit(0)
          if days > grace:
              print(f"::error::home ainda não indexada no Google após {days} dias (limite {grace}).")
              sys.exit(1)
          print(f"Pendente: home ainda não indexada (dia {days} de {grace}).")
          PY
