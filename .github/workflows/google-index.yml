name: Google Index Check

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  google-index:
    name: Check Google index status
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://thepaneb.github.io/vscode-utplsql/
      HOME_URL: https://thepaneb.github.io/vscode-utplsql/
      # Data em que o site entrou no ar; base do prazo de indexação.
      SITE_LIVE_DATE: '2026-10-07'
      GRACE_DAYS: '14'
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Inspect the home URL
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          python -m pip install --quiet --disable-pip-version-check google-auth requests
          python - <<'PY'
          import datetime
          import json
          import os
          import sys

          import requests
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          raw = os.environ.get("GSC_SERVICE_ACCOUNT_JSON", "")
          site = os.environ["SITE_URL"]
          home = os.environ["HOME_URL"]
          live = datetime.date.fromisoformat(os.environ["SITE_LIVE_DATE"])
          grace = int(os.environ["GRACE_DAYS"])

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          if not raw:
              fail("secret GSC_SERVICE_ACCOUNT_JSON ausente no repositório.")
          try:
              info = json.loads(raw)
          except ValueError as err:
              fail(f"GSC_SERVICE_ACCOUNT_JSON inválido: {err}")

          try:
              credentials = service_account.Credentials.from_service_account_info(
                  info,
                  scopes=["https://www.googleapis.com/auth/webmasters.readonly"],
              )
              credentials.refresh(Request())
          except Exception as err:  # noqa: BLE001 - qualquer falha de auth vira erro do run
              fail(f"falha ao autenticar no Google: {err}")

          auth_header = {"Authorization": f"Bearer {credentials.token}"}
          sites = requests.get(
              "https://www.googleapis.com/webmasters/v3/sites",
              headers=auth_header,
              timeout=30,
          )
          if sites.status_code != 200:
              fail(f"Sites API falhou (HTTP {sites.status_code}): {sites.text[:300]}")
          entries = sites.json().get("siteEntry", []) or []
          accessible = [f"{e.get('siteUrl')} ({e.get('permissionLevel')})" for e in entries]
          print("Propriedades acessíveis pela service account:")
          for item in accessible:
              print(f"  - {item}")
          if site not in [e.get("siteUrl") for e in entries]:
              fail(
                  f"a propriedade {site} não está acessível pela service account. "
                  f"Acessíveis: {accessible or 'nenhuma'}"
              )

          response = requests.post(
              "https://searchconsole.googleapis.com/v1/urlInspection/index:inspect",
              headers=auth_header,
              json={"inspectionUrl": home, "siteUrl": site},
              timeout=30,
          )
          if response.status_code != 200:
              fail(f"URL Inspection API falhou (HTTP {response.status_code}): {response.text[:300]}")
          data = response.json()

          status = data.get("inspectionResult", {}).get("indexStatusResult", {})
          verdict = status.get("verdict", "")
          coverage = status.get("coverageState", "")
          last_crawl = status.get("lastCrawlTime", "")
          canonical = status.get("googleCanonical", "")
          indexed = verdict == "PASS"

          days = (datetime.datetime.now(datetime.timezone.utc).date() - live).days

          table = (
              f"## Google index — {site}\n\n"
              "| Item | Valor |\n"
              "|---|---|\n"
              f"| Indexada | {str(indexed).lower()} |\n"
              f"| verdict | {verdict or '—'} |\n"
              f"| coverageState | {coverage or '—'} |\n"
              f"| lastCrawlTime | {last_crawl or '—'} |\n"
              f"| googleCanonical | {canonical or '—'} |\n"
              f"| Dias desde o go-live | {days} (limite: {grace}) |\n"
          )
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write(table)
          print(table)

          if indexed:
              print("OK: home indexada no Google.")
              sys.exit(0)
          if days > grace:
              fail(f"home ainda não indexada no Google após {days} dias (limite {grace}).")
          print(f"Pendente: home ainda não indexada (dia {days} de {grace}).")
          PY
