name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'docs/brain/70-Wiki/**'
      - 'scripts/brain-build.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Sync wiki from docs/wiki/
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Rebuild wiki from the vault (docs/brain/70-Wiki)
        run: node scripts/brain-build.cjs

      - name: Clone wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" clone \
            "https://github.com/${{ github.repository }}.wiki.git" /tmp/wiki
          # Persiste o header no repo efêmero (nunca na URL) para o push abaixo.
          git -C /tmp/wiki config http.extraheader "AUTHORIZATION: basic $AUTH"

      - name: Copy wiki pages
        run: |
          rm -rf /tmp/wiki/pt
          cp docs/wiki/*.md /tmp/wiki/
          [ -d docs/wiki/images ] && cp -r docs/wiki/images /tmp/wiki/

      - name: Commit and push
        run: |
          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to push"
          else
            git commit -m "Sincronização automática de docs/wiki/ [skip ci]"
            git push
          fi
