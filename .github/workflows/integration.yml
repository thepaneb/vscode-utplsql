name: Integration (Oracle)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/**'
      - 'scripts/db-matrix/**'
      - 'docker/db-matrix/**'
      - '.vscode-test*.mjs'
      - '.github/workflows/integration.yml'
  schedule:
    # Nightly: integração completa em um Oracle (23ai Free).
    - cron: '0 3 * * *'
    # Semanal: matriz pública 18c/21c em smoke (o 23ai full é o nightly).
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Escopo: smoke (rápido), full (23ai Free completo) ou matrix (18c/21c/23ai)'
        type: choice
        options: [smoke, full, matrix]
        default: smoke

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration (Oracle Free)
    # Roda no PR (smoke; o label `run-integration` ou a base `release/**`/caminho
    # crítico troca pelo full), no nightly e no dispatch. O schedule semanal da
    # matriz é tratado no job `matrix`.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'matrix')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORACLE_PWD: Oracle#2026
      UT3_PASSWORD: ut3#matrix2026
      TEST_PASSWORD: utplsql_test#2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Ensure xvfb (extension host)
        run: |
          command -v xvfb-run >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }

      - name: Decide scope
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          full="npm run test:integration && npm run test:integration:multiroot"
          smoke="npm run test:integration:smoke"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if ${{ contains(github.event.pull_request.labels.*.name, 'run-integration') }}; then
              echo "cmd=$full" >> "$GITHUB_OUTPUT"
            else
              # Full também quando a base é release/** ou o PR toca o caminho
              # crítico de execução/resultados/descoberta (PRD-125 RF4).
              git fetch --no-tags --depth=1 origin "$BASE_REF" >/dev/null 2>&1 || true
              changed="$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null || true)"
              if [[ "$BASE_REF" == release/* ]] || echo "$changed" | grep -Eq '^src/(oracleRunner|oracleRunCall|oraclePoll|results|discovery|runner|scriptRunner)\.ts$'; then
                echo "cmd=$full" >> "$GITHUB_OUTPUT"
              else
                echo "cmd=$smoke" >> "$GITHUB_OUTPUT"
              fi
            fi
          elif [ "${{ inputs.mode }}" = "smoke" ]; then
            echo "cmd=$smoke" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=$full" >> "$GITHUB_OUTPUT"
          fi

      - name: Run integration on Oracle 23ai Free
        run: bash scripts/db-matrix/run.sh --only 23free --tests "xvfb-run -a bash -c '${{ steps.scope.outputs.cmd }}'"

  matrix:
    name: Integration matrix (Oracle 18c/21c/23ai)
    # Dispatch `matrix` roda o full nos 3 bancos; o schedule semanal roda
    # 18c/21c em smoke (o 23ai full é o nightly).
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'matrix') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ORACLE_PWD: Oracle#2026
      UT3_PASSWORD: ut3#matrix2026
      TEST_PASSWORD: utplsql_test#2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Ensure xvfb (extension host)
        run: |
          command -v xvfb-run >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }

      - name: Run integration matrix
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            bash scripts/db-matrix/run.sh --only 18xe,21xe --smoke
          else
            bash scripts/db-matrix/run.sh --only 18xe,21xe,23free --tests "xvfb-run -a bash -c 'npm run test:integration && npm run test:integration:multiroot'"
          fi

      - name: Upload matrix summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-matrix-summary
          path: |
            docker/db-matrix/.cache/matrix-summary-*.md
            docker/db-matrix/.cache/matrix-summary-*.jsonl
            docker/db-matrix/.cache/logs/*.log
          if-no-files-found: warn
