name: Integration (Oracle)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/**'
      - 'scripts/db-matrix/**'
      - 'docker/db-matrix/**'
      - '.vscode-test*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/integration.yml'
  schedule:
    # Nightly: integração completa em um Oracle (23ai Free).
    - cron: '0 3 * * *'
    # Semanal: matriz pública 18c/21c em full (o 23ai full é o nightly).
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Escopo: smoke, full (23ai Free), matrix (18c/21c/23ai), matrix-smoke (18c/21c smoke), matrix-thick (18c/21c/23ai thick smoke), 19ee (smoke LTS), thick-full (23ai, experimental) ou thick-full-11g (experimental)'
        type: choice
        options: [smoke, full, matrix, matrix-smoke, matrix-thick, 19ee, thick-full, thick-full-11g]
        default: smoke

permissions:
  contents: read

concurrency:
  # Nightly (0 3) e semanal (0 4 dom) rodam sobre o mesmo ref (`main`); sem o
  # cron no grupo, o `cancel-in-progress` faz um derrubar o outro quando o
  # scheduler atrasa. PRs continuam cancelando o run anterior do mesmo PR.
  group: integration-${{ github.ref }}-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration (Oracle Free)
    # Roda no PR (smoke; o label `run-integration` ou a base `release/**`/caminho
    # crítico troca pelo full), no nightly e no dispatch. O schedule semanal da
    # matriz é tratado no job `matrix`.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'matrix' && inputs.mode != 'matrix-smoke' && inputs.mode != 'matrix-thick' && inputs.mode != '19ee' && inputs.mode != 'thick-full' && inputs.mode != 'thick-full-11g')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORACLE_PWD: Oracle#2026
      UT3_PASSWORD: ut3#matrix2026
      TEST_PASSWORD: utplsql_test#2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Ensure xvfb (extension host)
        run: |
          command -v xvfb-run >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }

      - name: Decide scope
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          full="npm run test:integration && npm run test:integration:multiroot"
          smoke="npm run test:integration:smoke"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if ${{ contains(github.event.pull_request.labels.*.name, 'run-integration') }}; then
              echo "cmd=$full" >> "$GITHUB_OUTPUT"
            else
              # Full também quando a base é release/** ou o PR toca o caminho
              # crítico de execução/resultados/descoberta ou as dependências
              # (um bump de node-oracledb afeta o runtime; PRD-125 RF4).
              git fetch --no-tags --depth=1 origin "$BASE_REF" >/dev/null 2>&1 || true
              changed="$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null || true)"
              if [[ "$BASE_REF" == release/* ]] || echo "$changed" | grep -Eq '^(src/(oracleRunner|oracleRunCall|oraclePoll|results|discovery|runner|scriptRunner)\.ts|package(-lock)?\.json)$'; then
                echo "cmd=$full" >> "$GITHUB_OUTPUT"
              else
                echo "cmd=$smoke" >> "$GITHUB_OUTPUT"
              fi
            fi
          elif [ "${{ inputs.mode }}" = "smoke" ]; then
            echo "cmd=$smoke" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=$full" >> "$GITHUB_OUTPUT"
          fi

      - name: Run integration on Oracle 23ai Free
        run: bash scripts/db-matrix/run.sh --only 23free --tests "xvfb-run -a bash -c '${{ steps.scope.outputs.cmd }}'"

  thick:
    name: Thick mode (Oracle Free)
    # Eixo thick no CI (PRD-125, revisão 2026-11-04): nightly e dispatch, sem
    # somar ~5 min em todo PR. Usa Instant Client baixado no runner (a imagem
    # 23free é thin; o thick valida o client nativo + o teste thickMode).
    # O dispatch `matrix`/`matrix-smoke`/`19ee` não roda o thick (foca no eixo
    # pedido); `smoke`/`full` e os thick-full continuam rodando.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'smoke' || inputs.mode == 'full' || inputs.mode == 'thick-full' || inputs.mode == 'thick-full-11g'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORACLE_PWD: Oracle#2026
      UT3_PASSWORD: ut3#matrix2026
      TEST_PASSWORD: utplsql_test#2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Ensure xvfb (extension host)
        run: |
          command -v xvfb-run >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }

      - name: Install Instant Client
        run: |
          # Ubuntu 24.04+ entrega libaio1t64; Instant Client procura libaio.so.1.
          sudo apt-get update
          sudo apt-get install -y unzip libaio1t64 || sudo apt-get install -y unzip libaio1
          if [ -e /usr/lib/x86_64-linux-gnu/libaio.so.1t64 ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          fi
          curl -fsSL -o "$RUNNER_TEMP/instantclient.zip" \
            https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip
          mkdir -p "$RUNNER_TEMP/instantclient"
          unzip -q "$RUNNER_TEMP/instantclient.zip" -d "$RUNNER_TEMP/instantclient"
          dir="$(find "$RUNNER_TEMP/instantclient" -maxdepth 1 -mindepth 1 -type d -name 'instantclient*' | head -1)"
          test -f "$dir/libclntsh.so" || { echo "Instant Client sem libclntsh.so"; exit 1; }
          echo "ORACLE_CLIENT_LIB_DIR=$dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$dir:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Run thick smoke on Oracle 23ai Free
        if: inputs.mode != 'thick-full' && inputs.mode != 'thick-full-11g'
        run: bash scripts/db-matrix/run.sh --only 23free --tests "xvfb-run -a bash -c 'npm run test:integration:thick'"

      - name: Run thick smoke on Oracle 11g
        # O 11g é thick-only (thin tem piso 12.1) e usa utPLSQL 3.1.14; o mesmo
        # Instant Client 23 cobre o legado (PRD-123).
        if: inputs.mode != 'thick-full' && inputs.mode != 'thick-full-11g'
        run: bash scripts/db-matrix/run.sh --only 11xe --tests "xvfb-run -a bash -c 'npm run test:integration:thick'"

      - name: Run thick-full on Oracle 23ai Free (nightly)
        # Eixo completo em thick no nightly, além do smoke; mantém o dispatch
        # `thick-full` como validação sob demanda.
        if: github.event_name == 'schedule'
        timeout-minutes: 20
        run: bash scripts/db-matrix/run.sh --only 23free --tests "xvfb-run -a bash -c 'npm run test:integration:thick-full'"

      - name: Run thick-full on Oracle 23ai Free
        # Eixo thick-full (PRD-150 RF1/RF5): a guarda falha o passo se o host
        # iniciar thin. Verde em 2026-11-08 (80 passing/13 pending), sem
        # `continue-on-error`; o 11g abaixo segue como probe experimental.
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'thick-full'
        timeout-minutes: 20
        run: bash scripts/db-matrix/run.sh --only 23free --tests "xvfb-run -a bash -c 'npm run test:integration:thick-full'"

      - name: Run thick-full on Oracle 11g (experimental)
        # Validação timeboxed do RF3 no legado. Em 2026-11-04 o run não completou
        # em 20 min (10 testes estouraram o timeout de 120 s); o passo fica como
        # probe e as falhas de 3.1/11g viram skips/issue, sem bloquear os eixos.
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'thick-full-11g'
        continue-on-error: true
        timeout-minutes: 20
        run: bash scripts/db-matrix/run.sh --only 11xe --tests "xvfb-run -a bash -c 'npm run test:integration:thick-full'"

  matrix:
    name: Integration matrix (Oracle 18c/21c/23ai)
    # Dispatch `matrix` roda o full nos 3 bancos; `matrix-smoke` e o schedule
    # semanal rodam 18c/21c em smoke (o 23ai full é o nightly).
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'matrix' || inputs.mode == 'matrix-smoke' || inputs.mode == '19ee')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ORACLE_PWD: Oracle#2026
      UT3_PASSWORD: ut3#matrix2026
      TEST_PASSWORD: utplsql_test#2026
      # Imagens EE (19ee) só puxam com credenciais do Oracle Container Registry.
      # Vazio ⇒ o passo do 19ee é pulado (o pull anônimo falharia).
      ORACLE_AUTH_USER: ${{ secrets.ORACLE_AUTH_USER }}
      ORACLE_AUTH_TOKEN: ${{ secrets.ORACLE_AUTH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Ensure xvfb (extension host)
        run: |
          command -v xvfb-run >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }

      - name: Run integration matrix
        run: |
          # O extension host precisa de display no Linux, inclusive no smoke.
          full="xvfb-run -a bash -c 'npm run test:integration && npm run test:integration:multiroot'"
          smoke="xvfb-run -a bash -c 'npm run test:integration:smoke'"
          if [ "${{ inputs.mode }}" = "19ee" ]; then
            # Validação do LTS sob demanda (mesmo recorte do smoke semanal).
            bash scripts/db-matrix/run.sh --only 19ee --tests "$smoke"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # Semanal: 18c/21c completos (o 23ai full é o nightly).
            bash scripts/db-matrix/run.sh --only 18xe,21xe --tests "$full"
          elif [ "${{ inputs.mode }}" = "matrix-smoke" ]; then
            bash scripts/db-matrix/run.sh --only 18xe,21xe --tests "$smoke"
          else
            bash scripts/db-matrix/run.sh --only 18xe,21xe,23free --tests "$full"
          fi

      - name: Run LTS 19ee smoke (weekly, requires EE credentials)
        # Sem ORACLE_AUTH_USER/TOKEN o pull da imagem enterprise falharia; o
        # passo é pulado até as credenciais serem cadastradas nos secrets.
        if: github.event_name == 'schedule' && env.ORACLE_AUTH_USER != ''
        run: bash scripts/db-matrix/run.sh --only 19ee --tests "xvfb-run -a bash -c 'npm run test:integration:smoke'"

      - name: Upload matrix summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-matrix-summary
          path: |
            docker/db-matrix/.cache/matrix-summary-*.md
            docker/db-matrix/.cache/matrix-summary-*.jsonl
            docker/db-matrix/.cache/logs/*.log
          if-no-files-found: warn

  matrix-thick:
    name: Integration matrix thick (Oracle 18c/21c/23ai)
    # Eixo thick da matriz: cada banco roda em um host isolado com Instant
    # Client; semanal/sob demanda para não somar ~5 min por banco em todo PR.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 5 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'matrix-thick')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ORACLE_PWD: Oracle#2026
      UT3_PASSWORD: ut3#matrix2026
      TEST_PASSWORD: utplsql_test#2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Ensure xvfb (extension host)
        run: |
          command -v xvfb-run >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y xvfb; }

      - name: Install Instant Client
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libaio1t64 || sudo apt-get install -y unzip libaio1
          if [ -e /usr/lib/x86_64-linux-gnu/libaio.so.1t64 ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          fi
          curl -fsSL -o "$RUNNER_TEMP/instantclient.zip" \
            https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip
          mkdir -p "$RUNNER_TEMP/instantclient"
          unzip -q "$RUNNER_TEMP/instantclient.zip" -d "$RUNNER_TEMP/instantclient"
          dir="$(find "$RUNNER_TEMP/instantclient" -maxdepth 1 -mindepth 1 -type d -name 'instantclient*' | head -1)"
          test -f "$dir/libclntsh.so" || { echo "Instant Client sem libclntsh.so"; exit 1; }
          echo "ORACLE_CLIENT_LIB_DIR=$dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$dir:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Run thick smoke matrix
        run: |
          bash scripts/db-matrix/run.sh \
            --only 18xe,21xe,23free \
            --tests "xvfb-run -a bash -c 'npm run test:integration:thick'"

      - name: Upload matrix summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-matrix-thick-summary
          path: |
            docker/db-matrix/.cache/matrix-summary-*.md
            docker/db-matrix/.cache/matrix-summary-*.jsonl
            docker/db-matrix/.cache/logs/*.log
          if-no-files-found: warn
