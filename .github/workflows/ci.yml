name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      # Documentação, drift, auditoria e versão rodam uma vez (Node 24); o
      # Node 26 é o eixo de compatibilidade do toolchain (PRD-47).
      - run: npm run audit:prod
        if: ${{ matrix.node-version == 24 }}
      - run: npm run version:check
        if: ${{ matrix.node-version == 24 }}
      - run: npm run brain:ci
        if: ${{ matrix.node-version == 24 }}
      - run: git diff --exit-code
        if: ${{ matrix.node-version == 24 }}
      - run: npm run docs:check
        if: ${{ matrix.node-version == 24 }}
      - run: npm run docs:features-check
        if: ${{ matrix.node-version == 24 }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ matrix.node-version == 24 }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          # Só o lcov do c8: sem isso o uploader varre coverage/tmp/*.json
          # (raw do c8) e o upload salta de ~264 KB para ~8,4 MB.
          disable_search: true
          flags: unit
          fail_ci_if_error: false
