name: Publish Extension

on:
  release:
    types: [published]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run compile
        run: npm run compile

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

  publish:
    name: Publish (${{ matrix.target }})
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # 4 alvos com glue thick; os demais vão thin-only (fallback sem binário).
        target:
          - win32-x64
          - linux-x64
          - linux-arm64
          - darwin-arm64
          - win32-arm64
          - darwin-x64
          - linux-armhf
          - alpine-x64
          - alpine-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package extension (${{ matrix.target }})
        run: npm run package:target -- ${{ matrix.target }}

      - name: Publish to VS Code Marketplace
        run: npm run publish -- --packagePath vscode-utplsql-*@${{ matrix.target }}.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Upload VSIX to GitHub Release
        run: gh release upload ${{ github.event.release.tag_name }} *.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
