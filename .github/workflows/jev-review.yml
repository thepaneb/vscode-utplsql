name: Jev Review

permissions:
  contents: read

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: jev-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # PRs de fork não recebem secrets; o job é pulado em vez de falhar.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Jev review (advisory)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          node scripts/jev-review.cjs \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --format markdown \
            --output jev-review.md
      - name: Publicar resumo
        if: always() && hashFiles('jev-review.md') != ''
        run: cat jev-review.md >> "$GITHUB_STEP_SUMMARY"
