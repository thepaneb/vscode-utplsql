# Matriz de bancos Oracle para testes de integração (um banco por vez).
#
# O serviço é genérico: a versão é escolhida por variáveis de ambiente, que o
# orquestrador `scripts/db-matrix/run.sh` define a partir de `matrix.env`.
# Assim não há duplicação de definição de serviço e o "um por vez" é natural.
#
# Uso manual (equivalente ao que o run.sh faz):
#   export DB_IMAGE=container-registry.oracle.com/database/free:23.26.3.0-lite
#   export DB_PORT=1531 ORACLE_PWD='Oracle#2026' ORACLE_CHARACTERSET=AL32UTF8
#   docker compose -f docker/db-matrix/compose.yaml up -d
#   ... bootstrap/testes ...
#   docker compose -f docker/db-matrix/compose.yaml down -v
#
# Sem volume nomeado: o banco é efêmero (recriado a cada versão). Isso evita
# dados incompatíveis entre versões e mantém o disco sob controle.

name: utplsql-dbmatrix

services:
  db:
    image: "${DB_IMAGE:?defina DB_IMAGE, ex database/free:23.26.3.0}"
    # Falha clara se a tag não tiver a arquitetura (ex.: enterprise:19.19.0.0 é
    # arm64-only no registry) em vez de "exec format error" no startup.
    platform: "${DB_PLATFORM:-linux/amd64}"
    container_name: "${DB_CONTAINER:-utplsql-dbmatrix}"
    shm_size: "${DB_SHM_SIZE:-2gb}"
    ports:
      - "${DB_PORT:-1531}:1521"
    environment:
      ORACLE_PWD: "${ORACLE_PWD:?defina ORACLE_PWD}"
      ORACLE_CHARACTERSET: "${ORACLE_CHARACTERSET:-AL32UTF8}"
    healthcheck:
      # Checa só o processo da instância: OS auth (`/ as sysdba`) falha em
      # algumas imagens (18c XE) e um grep por "1" casaria com "ORA-12547".
      # O wait-ready.sh confirma o PDB via SYSDBA por rede.
      test: ["CMD-SHELL", "ps -ef | grep -v grep | grep -q pmon"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 180s
