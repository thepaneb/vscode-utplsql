<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#fff"/>
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Oracle direto — streaming em tempo real</text>

  <rect x="40" y="60" width="240" height="420" rx="8" fill="#f0f4f8" stroke="#0366d6" stroke-width="2"/>
  <text x="160" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#0366d6">Extension Host</text>

  <rect x="64" y="108" width="192" height="54" rx="6" fill="#fff" stroke="#0366d6"/>
  <text x="160" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">conn1 (pool)</text>
  <text x="160" y="148" text-anchor="middle" font-size="10" fill="#555">ut_runner.run(...)</text>

  <rect x="64" y="196" width="192" height="54" rx="6" fill="#fff" stroke="#0366d6"/>
  <text x="160" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">conn2 (pool)</text>
  <text x="160" y="236" text-anchor="middle" font-size="10" fill="#555">poll a cada 200ms</text>

  <rect x="64" y="300" width="192" height="72" rx="6" fill="#fff" stroke="#0366d6"/>
  <text x="160" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">loop de leitura</text>
  <text x="160" y="342" text-anchor="middle" font-size="10" fill="#555">message_id &gt; :last</text>
  <text x="160" y="358" text-anchor="middle" font-size="10" fill="#555">até runner terminar</text>

  <rect x="64" y="402" width="192" height="58" rx="6" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="160" y="426" text-anchor="middle" font-size="12" font-weight="bold" fill="#721c24">cancelar</text>
  <text x="160" y="444" text-anchor="middle" font-size="10" fill="#721c24">conn.break() + race</text>

  <rect x="360" y="170" width="260" height="180" rx="8" fill="#cce5ff" stroke="#004085" stroke-width="2"/>
  <text x="490" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#004085">Oracle DB</text>
  <line x1="390" y1="210" x2="590" y2="210" stroke="#004085"/>
  <text x="490" y="232" text-anchor="middle" font-size="11" fill="#004085">ut_runner.run executa os testes</text>
  <text x="490" y="252" text-anchor="middle" font-size="11" fill="#004085">reporters escrevem em</text>
  <text x="490" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#004085">UT_OUTPUT_BUFFER_TMP</text>
  <text x="490" y="296" text-anchor="middle" font-size="10" fill="#004085">linhas: texto (doc) + XML (JUnit/cobertura)</text>
  <text x="490" y="314" text-anchor="middle" font-size="10" fill="#004085">is_finished marca o fim</text>

  <rect x="700" y="60" width="260" height="150" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="830" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#155724">Saída em tempo real</text>
  <text x="830" y="112" text-anchor="middle" font-size="11" fill="#155724">texto → Output panel</text>
  <text x="830" y="132" text-anchor="middle" font-size="11" fill="#155724">(documentation reporter)</text>
  <text x="830" y="158" text-anchor="middle" font-size="11" fill="#155724">cada teste aparece no</text>
  <text x="830" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#155724">Test Explorer ao terminar</text>

  <rect x="700" y="240" width="260" height="150" rx="8" fill="#fff3cd" stroke="#f0ad4e" stroke-width="2"/>
  <text x="830" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">Consolidação final</text>
  <text x="830" y="292" text-anchor="middle" font-size="11" fill="#856404">XML acumulado → parseJUnit</text>
  <text x="830" y="312" text-anchor="middle" font-size="11" fill="#856404">tag &lt;coverage&gt; → parseCobertura</text>
  <text x="830" y="338" text-anchor="middle" font-size="11" fill="#856404">Test Explorer + gutters</text>
  <text x="830" y="358" text-anchor="middle" font-size="11" fill="#856404">+ aba Coverage</text>

  <line x1="256" y1="135" x2="360" y2="195" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="256" y1="223" x2="360" y2="250" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="620" y1="250" x2="700" y2="145" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="620" y1="280" x2="700" y2="310" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="160" y1="368" x2="160" y2="402" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="256" y1="431" x2="360" y2="300" stroke="#dc3545" marker-end="url(#arrow)"/>

  <text x="500" y="496" text-anchor="middle" font-size="11" fill="#555">Sem arquivos temporários — resultados chegam conforme cada teste termina.</text>
</svg>
