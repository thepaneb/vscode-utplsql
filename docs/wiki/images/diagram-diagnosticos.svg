<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  <rect width="1000" height="460" fill="#fff"/>
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Diagnostics lifecycle</text>

  <!-- Fase 1 -->
  <rect x="30" y="56" width="290" height="368" rx="8" fill="#f0f4f8" stroke="#0366d6" stroke-width="2"/>
  <text x="175" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#0366d6">1 · Activation — setup</text>

  <rect x="52" y="100" width="246" height="44" rx="6" fill="#fff" stroke="#0366d6"/>
  <text x="175" y="119" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">SetupValidator</text>
  <text x="175" y="135" text-anchor="middle" font-size="10" fill="#555">validates proactively</text>

  <rect x="52" y="168" width="246" height="120" rx="6" fill="#fff" stroke="#0366d6"/>
  <text x="175" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">What is checked</text>
  <text x="175" y="212" text-anchor="middle" font-size="11" fill="#555">CLI in PATH · Java · connection</text>
  <text x="175" y="230" text-anchor="middle" font-size="11" fill="#555">versão utPLSQL ≥ 3.1.0</text>
  <text x="175" y="248" text-anchor="middle" font-size="11" fill="#555">coverage grants</text>
  <text x="175" y="266" text-anchor="middle" font-size="11" fill="#555">(DBMS_PROFILER)</text>

  <rect x="52" y="312" width="246" height="84" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="175" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#155724">Problems Panel</text>
  <text x="175" y="354" text-anchor="middle" font-size="10" fill="#155724">source: "utPLSQL Setup"</text>
  <text x="175" y="372" text-anchor="middle" font-size="10" fill="#155724">quick-fix: configure CLI,</text>
  <text x="175" y="388" text-anchor="middle" font-size="10" fill="#155724">connection, copy grants</text>

  <!-- Fase 2 -->
  <rect x="355" y="56" width="290" height="368" rx="8" fill="#f8f9fa" stroke="#555" stroke-width="2"/>
  <text x="500" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">2 · Execution — compilation</text>

  <rect x="377" y="100" width="246" height="44" rx="6" fill="#fff" stroke="#555"/>
  <text x="500" y="119" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Runs tests</text>
  <text x="500" y="135" text-anchor="middle" font-size="10" fill="#555">CLI executes packages</text>

  <rect x="377" y="168" width="246" height="120" rx="6" fill="#fff" stroke="#555"/>
  <text x="500" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">parseFromOutput</text>
  <text x="500" y="212" text-anchor="middle" font-size="11" fill="#555">reads CLI stdout</text>
  <text x="500" y="230" text-anchor="middle" font-size="11" fill="#555">captura PLS-* / ORA-06550</text>
  <text x="500" y="248" text-anchor="middle" font-size="11" fill="#555">resolveFiles maps to</text>
  <text x="500" y="266" text-anchor="middle" font-size="11" fill="#555">.pks / .pkb files</text>

  <rect x="377" y="312" width="246" height="84" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="500" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#155724">Editor</text>
  <text x="500" y="354" text-anchor="middle" font-size="10" fill="#155724">red underlines</text>
  <text x="500" y="372" text-anchor="middle" font-size="10" fill="#155724">Problems Panel</text>
  <text x="500" y="388" text-anchor="middle" font-size="10" fill="#155724">"utPLSQL Compilation"</text>

  <!-- Fase 3 -->
  <rect x="680" y="56" width="290" height="368" rx="8" fill="#fffdf5" stroke="#f0ad4e" stroke-width="2"/>
  <text x="825" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">3 · Post-execution</text>

  <rect x="702" y="100" width="246" height="44" rx="6" fill="#fff" stroke="#f0ad4e"/>
  <text x="825" y="119" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Coverage result</text>
  <text x="825" y="135" text-anchor="middle" font-size="10" fill="#555">empty or missing report</text>

  <rect x="702" y="168" width="246" height="120" rx="6" fill="#fff" stroke="#f0ad4e"/>
  <text x="825" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">UTPLSQL_NO_COVERAGE</text>
  <text x="825" y="212" text-anchor="middle" font-size="11" fill="#555">warning no Problems Panel</text>
  <text x="825" y="230" text-anchor="middle" font-size="11" fill="#555">common cause: missing grant</text>
  <text x="825" y="248" text-anchor="middle" font-size="11" fill="#555">EXECUTE ON DBMS_PROFILER</text>
  <text x="825" y="266" text-anchor="middle" font-size="11" fill="#555">+ DBMS_PLSQL_CODE_COVERAGE</text>

  <rect x="702" y="312" width="246" height="84" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="825" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#155724">Quick-fix</text>
  <text x="825" y="354" text-anchor="middle" font-size="10" fill="#155724">Copy grants to</text>
  <text x="825" y="372" text-anchor="middle" font-size="10" fill="#155724">clipboard (ready SQL)</text>
  <text x="825" y="388" text-anchor="middle" font-size="10" fill="#155724">or Validate configuration</text>

  <line x1="320" y1="240" x2="355" y2="240" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="645" y1="240" x2="680" y2="240" stroke="#555" marker-end="url(#arrow)"/>

  <text x="500" y="450" text-anchor="middle" font-size="11" fill="#555">All diagnostics are non-blocking — only critical errors (no CLI, no connection) prevent execution.</text>
</svg>
