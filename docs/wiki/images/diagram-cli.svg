<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  <rect width="1200" height="380" fill="#fff"/>
  <text x="600" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Modo CLI — batch (runnerMode: cli)</text>

  <rect x="30" y="120" width="170" height="60" rx="8" fill="#e2e3e5" stroke="#555" stroke-width="1.5"/>
  <text x="115" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Test Explorer</text>
  <text x="115" y="163" text-anchor="middle" font-size="10" fill="#555">menu de contexto</text>

  <rect x="230" y="120" width="170" height="60" rx="6" fill="#fff" stroke="#555"/>
  <text x="315" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Discovery</text>
  <text x="315" y="163" text-anchor="middle" font-size="10" fill="#555">.pks — %suite / %test</text>

  <rect x="430" y="108" width="190" height="84" rx="6" fill="#fff" stroke="#0366d6" stroke-width="2"/>
  <text x="525" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#0366d6">utplsql run</text>
  <text x="525" y="150" text-anchor="middle" font-size="10" fill="#555">-p=&lt;suites&gt;</text>
  <text x="525" y="166" text-anchor="middle" font-size="10" fill="#555">3 reporters padrão</text>

  <line x1="200" y1="150" x2="230" y2="150" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="400" y1="150" x2="430" y2="150" stroke="#555" marker-end="url(#arrow)"/>

  <!-- Branch A: JUnit -->
  <rect x="660" y="50" width="190" height="44" rx="6" fill="#fff" stroke="#555"/>
  <text x="755" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">ut_junit_reporter</text>
  <text x="755" y="85" text-anchor="middle" font-size="10" fill="#555">-o=results.xml</text>

  <rect x="880" y="50" width="120" height="44" rx="6" fill="#f8f9fa" stroke="#bbb"/>
  <text x="940" y="70" text-anchor="middle" font-size="11" fill="#555">results.xml</text>
  <text x="940" y="85" text-anchor="middle" font-size="10" fill="#888">arquivo temp</text>

  <rect x="1030" y="50" width="140" height="44" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="1100" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#155724">parseJUnit</text>
  <text x="1100" y="85" text-anchor="middle" font-size="10" fill="#155724">view de testes</text>

  <!-- Branch B: Cobertura -->
  <rect x="660" y="130" width="190" height="44" rx="6" fill="#fff" stroke="#555"/>
  <text x="755" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">ut_coverage_cobertura_reporter</text>
  <text x="755" y="165" text-anchor="middle" font-size="10" fill="#555">-o=coverage.xml</text>

  <rect x="880" y="130" width="120" height="44" rx="6" fill="#f8f9fa" stroke="#bbb"/>
  <text x="940" y="150" text-anchor="middle" font-size="11" fill="#555">coverage.xml</text>
  <text x="940" y="165" text-anchor="middle" font-size="10" fill="#888">arquivo temp</text>

  <rect x="1030" y="130" width="140" height="44" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="1100" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#155724">parseCobertura</text>
  <text x="1100" y="165" text-anchor="middle" font-size="10" fill="#155724">gutters + % Coverage</text>

  <!-- Branch C: doc -->
  <rect x="660" y="210" width="190" height="44" rx="6" fill="#fff" stroke="#555"/>
  <text x="755" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">ut_documentation_reporter</text>
  <text x="755" y="245" text-anchor="middle" font-size="10" fill="#555">-c (stdout)</text>

  <rect x="880" y="210" width="120" height="44" rx="6" fill="#f8f9fa" stroke="#bbb"/>
  <text x="940" y="230" text-anchor="middle" font-size="11" fill="#555">stdout</text>
  <text x="940" y="245" text-anchor="middle" font-size="10" fill="#888">em tempo real</text>

  <rect x="1030" y="210" width="140" height="44" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="1100" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#155724">appendOutput</text>
  <text x="1100" y="245" text-anchor="middle" font-size="10" fill="#155724">terminal de testes</text>

  <line x1="620" y1="120" x2="660" y2="72" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="620" y1="140" x2="660" y2="152" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="620" y1="165" x2="660" y2="232" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="850" y1="72" x2="880" y2="72" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="1000" y1="72" x2="1030" y2="72" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="850" y1="152" x2="880" y2="152" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="1000" y1="152" x2="1030" y2="152" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="850" y1="232" x2="880" y2="232" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="1000" y1="232" x2="1030" y2="232" stroke="#555" marker-end="url(#arrow)"/>

  <text x="600" y="350" text-anchor="middle" font-size="11" fill="#555">Resultados aparecem na view de testes somente após o batch terminar — arquivos temporários em %TEMP%.</text>
</svg>
