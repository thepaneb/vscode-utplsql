<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#fff"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Oracle connection resolution</text>

  <rect x="330" y="52" width="240" height="44" rx="8" fill="#e2e3e5" stroke="#555" stroke-width="1.5"/>
  <text x="450" y="79" text-anchor="middle" font-size="13" fill="#333">Run tests</text>

  <line x1="450" y1="96" x2="450" y2="118" stroke="#555" marker-end="url(#arrow)"/>

  <!-- 1: setting -->
  <polygon points="450,118 588,160 450,202 312,160" fill="#fff" stroke="#0366d6" stroke-width="2"/>
  <text x="450" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#0366d6">utplsql.connection?</text>

  <line x1="588" y1="160" x2="662" y2="160" stroke="#28a745" marker-end="url(#arrow)"/>
  <rect x="666" y="136" width="200" height="48" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="766" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#155724">Uses setting</text>
  <text x="766" y="172" text-anchor="middle" font-size="10" fill="#155724">persists in settings.json</text>
  <text x="627" y="152" font-size="11" fill="#28a745">yes</text>

  <line x1="450" y1="202" x2="450" y2="244" stroke="#555" marker-end="url(#arrow)"/>
  <text x="462" y="230" font-size="10" fill="#555">no</text>

  <!-- 2: env -->
  <polygon points="450,244 588,286 450,328 312,286" fill="#fff" stroke="#0366d6" stroke-width="2"/>
  <text x="450" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#0366d6">UTPLSQL_CONN?</text>

  <line x1="588" y1="286" x2="662" y2="286" stroke="#28a745" marker-end="url(#arrow)"/>
  <rect x="666" y="262" width="200" height="48" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="766" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#155724">Uses env var</text>
  <text x="766" y="298" text-anchor="middle" font-size="10" fill="#155724">shell session only</text>
  <text x="627" y="278" font-size="11" fill="#28a745">yes</text>

  <line x1="450" y1="328" x2="450" y2="370" stroke="#555" marker-end="url(#arrow)"/>
  <text x="462" y="356" font-size="10" fill="#555">no</text>

  <!-- 3: cache -->
  <polygon points="450,370 588,412 450,454 312,412" fill="#fff" stroke="#0366d6" stroke-width="2"/>
  <text x="450" y="418" text-anchor="middle" font-size="11" font-weight="bold" fill="#0366d6">session cache?</text>

  <line x1="588" y1="412" x2="662" y2="412" stroke="#28a745" marker-end="url(#arrow)"/>
  <rect x="666" y="388" width="200" height="48" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="766" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#155724">Uses cache</text>
  <text x="766" y="424" text-anchor="middle" font-size="10" fill="#155724">until VSCode closes</text>
  <text x="627" y="404" font-size="11" fill="#28a745">yes</text>

  <line x1="450" y1="454" x2="450" y2="496" stroke="#555" marker-end="url(#arrow)"/>
  <text x="462" y="482" font-size="10" fill="#555">no</text>

  <!-- 4: prompt -->
  <polygon points="450,496 588,526 450,556 312,526" fill="#fff" stroke="#f0ad4e" stroke-width="2"/>
  <text x="450" y="532" text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">prompt user</text>

  <line x1="588" y1="526" x2="662" y2="526" stroke="#28a745" marker-end="url(#arrow)"/>
  <rect x="666" y="502" width="200" height="48" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="766" y="522" text-anchor="middle" font-size="12" font-weight="bold" fill="#155724">Uses input</text>
  <text x="766" y="538" text-anchor="middle" font-size="10" fill="#155724">stored in session only</text>
  <text x="627" y="518" font-size="11" fill="#28a745">entered</text>

  <line x1="588" y1="556" x2="588" y2="576" stroke="#dc3545" marker-end="url(#arrow)"/>
  <text x="600" y="572" font-size="10" fill="#dc3545">cancelled</text>
  <rect x="666" y="560" width="200" height="40" rx="6" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="766" y="585" text-anchor="middle" font-size="12" font-weight="bold" fill="#721c24">No connection — warning</text>

  <rect x="40" y="470" width="200" height="110" rx="8" fill="#f8f9fa" stroke="#bbb"/>
  <text x="140" y="494" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Security</text>
  <text x="140" y="514" text-anchor="middle" font-size="10" fill="#555">prefer UTPLSQL_CONN</text>
  <text x="140" y="530" text-anchor="middle" font-size="10" fill="#555">(no password in repo)</text>
  <text x="140" y="550" text-anchor="middle" font-size="10" fill="#555">setting = risks</text>
  <text x="140" y="566" text-anchor="middle" font-size="10" fill="#555">in shared environments</text>
</svg>
