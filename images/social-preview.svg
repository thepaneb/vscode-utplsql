<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!--
    Social preview do repositório (1280x640 — especificação do GitHub).
    Gerado para images/social-preview.png por scripts/gen-social-preview.cjs.
    Paleta: #0d1117 (fundo), #007acc (VS Code), #2ea043 (check do ícone).
  -->
  <defs>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1160 10) scale(560)">
      <stop offset="0" stop-color="#007acc" stop-opacity="0.24"/>
      <stop offset="0.62" stop-color="#007acc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(90 660) scale(400)">
      <stop offset="0" stop-color="#2ea043" stop-opacity="0.18"/>
      <stop offset="0.65" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#0d1117"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glowBlue)"/>
  <rect width="1280" height="640" fill="url(#glowGreen)"/>

  <!-- Ícone oficial (images/icon.svg) em 190x190 -->
  <g transform="translate(72 225) scale(1.484375)">
    <rect x="4" y="4" width="120" height="120" rx="26" fill="#21262d"/>
    <ellipse cx="52" cy="40" rx="24" ry="9" fill="#e9eef3"/>
    <path d="M28 40 V84 A24 9 0 0 0 76 84 V40" fill="#d2dae2"/>
    <path d="M28 62 A24 9 0 0 0 76 62" fill="none" stroke="#a7b3bd" stroke-width="2"/>
    <circle cx="88" cy="90" r="24" fill="#2ea043" stroke="#21262d" stroke-width="3"/>
    <path d="M76 90 l8 9 l16 -19" fill="none" stroke="#ffffff" stroke-width="7"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bloco de texto -->
  <g font-family="Segoe UI, DejaVu Sans, Inter, Arial, sans-serif">
    <rect x="316" y="222" width="88" height="8" rx="4" fill="#007acc"/>
    <text x="314" y="316" font-size="66" font-weight="700" letter-spacing="-1.5" xml:space="preserve"
      fill="#e6edf3">utPLSQL <tspan fill="#4aa3e0">Test Runner</tspan></text>
    <text x="314" y="358" font-size="26" fill="#9198a1"
      >Run, debug and cover Oracle PL/SQL tests in VS Code</text>

    <!-- Chips -->
    <g font-size="18" font-weight="700">
      <rect x="314" y="392" width="190" height="38" rx="19" fill="#2ea043" fill-opacity="0.12"
        stroke="#2ea043" stroke-opacity="0.55"/>
      <text x="330" y="417" fill="#7ee787">Test Explorer</text>

      <rect x="516" y="392" width="130" height="38" rx="19" fill="#161b22" stroke="#30363d"/>
      <text x="532" y="417" fill="#c9d1d9">Coverage</text>

      <rect x="658" y="392" width="198" height="38" rx="19" fill="#161b22" stroke="#30363d"/>
      <text x="674" y="417" fill="#c9d1d9">PL/SQL debugger</text>

      <rect x="868" y="392" width="171" height="38" rx="19" fill="#161b22" stroke="#30363d"/>
      <text x="884" y="417" fill="#c9d1d9">24 languages</text>
    </g>
  </g>
</svg>
